<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" fill="none" role="img" aria-labelledby="titulo-ilustracao desc-ilustracao">
  <title id="titulo-ilustracao">Ilustração abstrata de equilíbrio mental</title>
  <desc id="desc-ilustracao">Círculos concêntricos e ondas suaves em tons de azul representando serenidade e equilíbrio.</desc>

  <defs>
    <radialGradient id="halo-central" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#47769B" stop-opacity="0.42"/>
      <stop offset="60%" stop-color="#1D3552" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#101B2B" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="anel-principal" x1="120" y1="100" x2="400" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8EEF4" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#47769B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1D3552" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="onda-suave" x1="80" y1="260" x2="440" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#47769B" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#E8EEF4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#47769B" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="nucleo-gradiente" x1="205" y1="205" x2="315" y2="315" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#47769B"/>
      <stop offset="100%" stop-color="#1D3552"/>
    </linearGradient>
  </defs>

  <!-- Brilho ambiental de fundo -->
  <circle cx="260" cy="260" r="230" fill="url(#halo-central)"/>

  <!-- Órbitas geométricas -->
  <circle cx="260" cy="260" r="205" stroke="#A9B9C9" stroke-opacity="0.14" stroke-width="1" stroke-dasharray="5 7"/>
  <circle cx="260" cy="260" r="165" stroke="url(#anel-principal)" stroke-width="1.5"/>
  <circle cx="260" cy="260" r="122" stroke="#47769B" stroke-opacity="0.45" stroke-width="1.2"/>

  <!-- Ondas de respiração e equilíbrio -->
  <path d="M72 260C118 205 162 205 208 260C254 315 298 315 344 260C390 205 420 220 448 260" stroke="url(#onda-suave)" stroke-width="2" stroke-linecap="round"/>
  <path d="M96 276C142 232 184 232 228 276C272 320 314 320 358 276C395 239 415 245 432 268" stroke="#A9B9C9" stroke-opacity="0.32" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Forma orgânica suave central -->
  <path d="M260 156C305 156 356 196 356 260C356 320 312 364 260 364C208 364 164 320 164 260C164 196 215 156 260 156Z" fill="#1D3552" fill-opacity="0.55" stroke="#A9B9C9" stroke-opacity="0.28" stroke-width="1.2"/>

  <!-- Núcleo de foco -->
  <circle cx="260" cy="260" r="54" fill="url(#nucleo-gradiente)" stroke="#E8EEF4" stroke-opacity="0.4" stroke-width="1.5"/>
  <circle cx="260" cy="260" r="24" fill="#101B2B" stroke="#A9B9C9" stroke-opacity="0.65" stroke-width="1.5"/>
  <circle cx="260" cy="260" r="8" fill="#FFFFFF"/>

  <!-- Pontos orbitais discretos -->
  <circle cx="260" cy="55" r="5" fill="#E8EEF4" fill-opacity="0.85"/>
  <circle cx="425" cy="260" r="4" fill="#47769B"/>
  <circle cx="143" cy="377" r="4.5" fill="#A9B9C9" fill-opacity="0.75"/>
  <circle cx="378" cy="145" r="3.5" fill="#E8EEF4" fill-opacity="0.6"/>
</svg>
